rubrics:
  - id: 1
    type: f2p
    text: 生成期间点击停止、关闭菜单、切换文档或卸载编辑器会中止对应请求，取消后不再应用迟到分片、成功提示或错误提示。
  - id: 2
    type: f2p
    text: WSGI 模式下消费端提前关闭会通知异步生产端、关闭 provider 流并让桥接线程在有限时间内退出，不会阻塞在 join 或持续堆积队列。
  - id: 3
    type: f2p
    text: ASGI 模式下客户端断开或取消会传播到上游异步流并执行资源清理，不会继续读取或保留 provider 连接。
  - id: 4
    type: f2p
    text: 取消与正常结束或 provider 异常并发发生时，流和线程只收尾一次；主动取消不伪装成失败，真实异常仍能被调用方观察。
  - id: 5
    type: p2p
    text: 未取消的流仍按原顺序输出全部 SSE 分片，并保留现有 Content-Type、x-vercel-ai-data-stream 和 X-Accel-Buffering 响应头。
  - id: 6
    type: p2p
    text: AI 权限、功能开关、请求校验和限流行为保持兼容，取消机制不能绕过已有访问控制或吞掉 400、403、429 响应。
  - id: 7
    type: f2p
    text: 连续执行取消后重试和多次独立生成时，各请求的取消状态相互隔离，测试结束后没有存活的桥接线程或未关闭异步生成器。
