rubrics:
  - id: 1
    type: f2p
    text: 导出进行中点击取消、关闭弹窗、切换文档或卸载页面会取消对应作业，之后不会下载文件或显示该作业的成功、失败提示。
  - id: 2
    type: f2p
    text: 每次导出在启动时固定文档内容、标题、格式和文档标识，编辑或导航发生在中途时不会改变该次输入或把结果归到另一篇文档。
  - id: 3
    type: f2p
    text: PDF、DOCX、ODT、Markdown 和 HTML 路径中的媒体、代理和样式 fetch 都接收同一次取消信号，取消会终止尚未完成的请求。
  - id: 4
    type: f2p
    text: 转换器或 ZIP 压缩无法立即中断时，取消标记会在下载前生效并丢弃晚到 Blob，不产生残缺文件或迟到回调。
  - id: 5
    type: f2p
    text: 取消旧作业后立即开始新导出时，两次作业状态相互隔离，旧作业的 finally、媒体结果或提示不会结束或污染新作业。
  - id: 6
    type: p2p
    text: 非取消的单个媒体读取失败继续沿用现有降级策略，而不是把整个 Markdown 或 HTML 导出误判为取消。
  - id: 7
    type: p2p
    text: 未取消的五种格式仍保持现有文件名、媒体本地化、HTML 可访问性处理、成功提示和正常关闭弹窗行为。
